name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile backend/app.py

  docker:
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-projet-devops:latest .

      - name: Publier l'image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-projet-devops:latest
